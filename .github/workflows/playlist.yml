# THE CRATE — refresh data/playlist.json from Spotify once a day.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET, SPOTIFY_REFRESH_TOKEN,
#   SPOTIFY_PLAYLIST_IDS (comma-separated)
# The refresh token comes from signing in once through the local proxy's
# /login page; it is written to server/.env.
name: Refresh playlist

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:        # "Run workflow" button for an immediate refresh

permissions:
  contents: write

concurrency:
  group: playlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build data/playlist.json
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_IDS: ${{ secrets.SPOTIFY_PLAYLIST_IDS }}
        run: node server/build-playlist.mjs

      - name: Commit if the songs changed
        run: |
          if git diff --quiet -- data/playlist.json && ! git ls-files --others --exclude-standard -- data/playlist.json | grep -q .; then
            echo "no change"
            exit 0
          fi
          git config user.name "crate-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/playlist.json
          git commit -m "chore: refresh playlist"
          git push
